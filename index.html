<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="県水通商株式会社の営業・顧客管理システム（顧客管理）"
    />
    <title>顧客管理 | 県水通商株式会社</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#" aria-label="顧客一覧へ戻る">
        <span class="brand-mark" aria-hidden="true">県</span>
        <span>
          <strong>県水通商株式会社</strong>
          <small>営業・顧客管理システム</small>
        </span>
      </a>
      <div class="header-title">
        <span>顧客管理</span>
        <small>Customer Management</small>
      </div>
    </header>

    <main class="page-shell">
      <section id="customer-list-view" aria-labelledby="list-title">
        <div class="page-heading">
          <div>
            <p class="eyebrow">CUSTOMERS</p>
            <h1 id="list-title">顧客一覧</h1>
            <p>お取引先の情報を確認・管理できます。</p>
          </div>
          <button class="primary-button" type="button" disabled title="この画面は閲覧用のデモです">
            ＋ 新規顧客登録
          </button>
        </div>

        <div class="list-toolbar">
          <label class="search-field">
            <span class="sr-only">顧客を検索</span>
            <span aria-hidden="true">⌕</span>
            <input id="customer-search" type="search" placeholder="会社名・担当者名・顧客番号で検索" />
          </label>
          <p id="customer-count" class="customer-count" aria-live="polite"></p>
        </div>

        <div class="table-card">
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th scope="col">顧客番号</th>
                  <th scope="col">会社名称</th>
                  <th scope="col">顧客タイプ</th>
                  <th scope="col">連絡担当者</th>
                  <th scope="col">電話</th>
                  <th scope="col">メール</th>
                  <th scope="col">主な取扱製品</th>
                  <th scope="col">状況</th>
                  <th scope="col"><span class="sr-only">詳細を表示</span></th>
                </tr>
              </thead>
              <tbody id="customer-table-body"></tbody>
            </table>
          </div>
          <p id="empty-state" class="empty-state" hidden>該当する顧客は見つかりませんでした。</p>
        </div>
      </section>

      <section id="customer-detail-view" hidden aria-labelledby="detail-title">
        <button id="back-to-list" class="back-button" type="button">← 顧客一覧へ戻る</button>

        <div class="detail-hero">
          <div>
            <p class="eyebrow">CUSTOMER DETAIL</p>
            <div class="detail-title-row">
              <h1 id="detail-title"></h1>
              <span id="detail-status"></span>
            </div>
            <p id="detail-number" class="customer-number"></p>
          </div>
          <button class="secondary-button" type="button" disabled title="この画面は閲覧用のデモです">編集</button>
        </div>

        <section class="detail-card" aria-labelledby="profile-title">
          <div class="section-heading">
            <div>
              <p class="eyebrow">PROFILE</p>
              <h2 id="profile-title">顧客基本情報</h2>
            </div>
          </div>
          <dl id="customer-profile" class="profile-grid"></dl>
        </section>

        <section class="detail-card" aria-labelledby="quote-title">
          <div class="section-heading">
            <div>
              <p class="eyebrow">QUOTATION HISTORY</p>
              <h2 id="quote-title">見積履歴</h2>
            </div>
          </div>
          <div class="table-scroll">
            <table class="detail-table">
              <thead>
                <tr>
                  <th scope="col">見積番号</th>
                  <th scope="col">日付</th>
                  <th scope="col">製品</th>
                  <th scope="col">数量</th>
                  <th scope="col">単価</th>
                  <th scope="col">合計金額</th>
                  <th scope="col">状況</th>
                </tr>
              </thead>
              <tbody id="quote-table-body"></tbody>
            </table>
          </div>
        </section>

        <section class="detail-card" aria-labelledby="follow-up-title">
          <div class="section-heading">
            <div>
              <p class="eyebrow">FOLLOW-UP RECORDS</p>
              <h2 id="follow-up-title">フォローアップ記録</h2>
            </div>
          </div>
          <div id="follow-up-list" class="follow-up-list"></div>
        </section>
      </section>
    </main>

    <footer>© 県水通商株式会社　営業・顧客管理システム</footer>
    <script src="app.js"></script>
  </body>
</html>
